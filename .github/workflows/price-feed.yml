name: GC Graphics — Actualizar precios y miniaturas
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */3 * * *"
  push:
    paths:
      - "scripts/refresh-prices.mjs"
      - "data/items.json"
permissions:
  contents: write
concurrency:
  group: gc-graphics-price-feed
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Actualizar capturas verificadas
        run: node scripts/refresh-prices.mjs
      - name: Publicar datos con fecha de captura
        shell: bash
        run: |
          if git diff --quiet -- data/price-cache.json; then
            echo "Sin cambios en el feed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/price-cache.json
          git commit -m "data: refresh verified merchant feed [skip ci]"
          git push
